<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="1060" height="400" font-family="KaiTi, STKaiti, SimHei, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6a44"/>
    </marker>
  </defs>

  <rect x="30" y="26" width="170" height="64" rx="8" fill="#f6e7c8" stroke="#b8863b" stroke-width="1.4"/>
  <text x="115" y="52" font-size="14" fill="#4a2f17" font-weight="bold" text-anchor="middle">用户照片</text>
  <text x="115" y="74" font-size="11.5" fill="#6b4a2a" text-anchor="middle">人像 / 任意皮影照</text>

  <line x1="200" y1="58" x2="240" y2="58" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="244" y="26" width="170" height="64" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="329" y="50" font-size="13" fill="#4a2f17" font-weight="bold" text-anchor="middle">① 人物门禁</text>
  <text x="329" y="72" font-size="11.5" fill="#6b4a2a" text-anchor="middle">是否人像 / 是否违规</text>

  <line x1="414" y1="58" x2="454" y2="58" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="458" y="26" width="170" height="64" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="543" y="50" font-size="13" fill="#4a2f17" font-weight="bold" text-anchor="middle">② 图像生成</text>
  <text x="543" y="72" font-size="11.5" fill="#6b4a2a" text-anchor="middle">fast 零件图 / refined 定妆图</text>

  <line x1="628" y1="58" x2="668" y2="58" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="672" y="26" width="170" height="64" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="757" y="50" font-size="13" fill="#4a2f17" font-weight="bold" text-anchor="middle">③ 抠图分割</text>
  <text x="757" y="72" font-size="11.5" fill="#6b4a2a" text-anchor="middle">洋红底 → 透明部件</text>

  <line x1="842" y1="58" x2="882" y2="58" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="886" y="26" width="150" height="64" rx="8" fill="#f6e7c8" stroke="#b8863b" stroke-width="1.4"/>
  <text x="961" y="50" font-size="13" fill="#4a2f17" font-weight="bold" text-anchor="middle">④ 关节装配</text>
  <text x="961" y="72" font-size="11.5" fill="#6b4a2a" text-anchor="middle">标准 15 关节树</text>

  <!-- 下行到装配与校验 -->
  <path d="M961,90 L961,126" stroke="#8a6a44" stroke-width="1.5" fill="none" marker-end="url(#a4)"/>

  <rect x="700" y="130" width="336" height="62" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="720" y="154" font-size="13" fill="#4a2f17" font-weight="bold">⑤ 校验</text>
  <text x="720" y="176" font-size="11.5" fill="#6b4a2a">零件尺寸 · 关节可达 · manifest 合法性</text>

  <path d="M700,161 L646,161" stroke="#8a6a44" stroke-width="1.5" fill="none" marker-end="url(#a4)"/>

  <rect x="330" y="130" width="312" height="62" rx="8" fill="#f6e7c8" stroke="#b8863b" stroke-width="1.4"/>
  <text x="350" y="154" font-size="13" fill="#4a2f17" font-weight="bold">⑥ 注册进角色库</text>
  <text x="350" y="176" font-size="11.5" fill="#6b4a2a">可直接上台表演，也可导出复用</text>

  <path d="M486,192 L486,232" stroke="#8a6a44" stroke-width="1.5" fill="none" marker-end="url(#a4)"/>

  <rect x="180" y="236" width="612" height="58" rx="8" fill="#fdfaf3" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="200" y="262" font-size="13" fill="#4a2f17" font-weight="bold">产出：可动影偶</text>
  <text x="200" y="284" font-size="11.5" fill="#5a4632">15 个可独立旋转的部件（头 / 躯干 / 上臂 / 前臂 / 手 / 大腿 / 小腿 / 披风 / 兵器），不是一张静态图</text>

  <!-- 降级路径 -->
  <rect x="30" y="316" width="1000" height="66" rx="8" fill="#fffdf8" stroke="#b8863b" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="50" y="342" font-size="13" fill="#8a5a1e" font-weight="bold">降级路径</text>
  <text x="50" y="366" font-size="12" fill="#5a4632">未配置图像生成模型时，由 procedural.js 用照片采样主色 + 皮影造型规则（对称 / 镂空 / 描边）程序化合成整套部件，同样可注册；界面标注「本次由本地皮影合成器生成」。</text>
</svg>
