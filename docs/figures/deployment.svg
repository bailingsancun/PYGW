<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" font-family="KaiTi, STKaiti, SimHei, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6a44"/>
    </marker>
  </defs>

  <rect x="60" y="20" width="900" height="46" rx="8" fill="#f6e7c8" stroke="#b8863b" stroke-width="1.4"/>
  <text x="510" y="49" font-size="15" fill="#4a2f17" font-weight="bold" text-anchor="middle">浏览器　HTTPS</text>
  <line x1="510" y1="66" x2="510" y2="100" stroke="#8a6a44" stroke-width="1.6" marker-end="url(#a5)"/>

  <rect x="60" y="104" width="900" height="52" rx="8" fill="#fdfaf3" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="80" y="128" font-size="14" fill="#4a2f17" font-weight="bold">反向代理　Nginx / static-server.js</text>
  <text x="80" y="148" font-size="12" fill="#5a4632">按路径分流：静态文件与三个后端服务在同一域名下</text>

  <!-- 四条分流 -->
  <line x1="180" y1="156" x2="180" y2="196" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="400" y1="156" x2="400" y2="196" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="620" y1="156" x2="620" y2="196" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="840" y1="156" x2="840" y2="196" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="80" y="200" width="200" height="86" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="96" y="224" font-size="13" fill="#4a2f17" font-weight="bold">/</text>
  <text x="96" y="246" font-size="12" fill="#5a4632">SPA 静态文件</text>
  <text x="96" y="266" font-size="12" fill="#5a4632">dist/ 构建产物</text>

  <rect x="300" y="200" width="200" height="86" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="316" y="224" font-size="13" fill="#4a2f17" font-weight="bold">/api/v1/**</text>
  <text x="316" y="246" font-size="12" fill="#5a4632">数据服务 shim</text>
  <text x="316" y="266" font-size="12" fill="#5a4632">:8787 只读</text>

  <rect x="520" y="200" width="200" height="86" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="536" y="224" font-size="13" fill="#4a2f17" font-weight="bold">/api/ai/**</text>
  <text x="536" y="246" font-size="12" fill="#5a4632">AI 服务</text>
  <text x="536" y="266" font-size="12" fill="#5a4632">:8788 SSE 流式</text>

  <rect x="740" y="200" width="200" height="86" rx="8" fill="#fff6e5" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="756" y="224" font-size="13" fill="#4a2f17" font-weight="bold">/images/**</text>
  <text x="756" y="246" font-size="12" fill="#5a4632">素材目录</text>
  <text x="756" y="266" font-size="12" fill="#5a4632">assets/images</text>

  <!-- 下游 -->
  <line x1="400" y1="286" x2="400" y2="322" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>
  <line x1="620" y1="286" x2="620" y2="322" stroke="#8a6a44" stroke-width="1.5" marker-end="url(#a5)"/>

  <rect x="300" y="326" width="200" height="72" rx="8" fill="#fdfaf3" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="316" y="352" font-size="13" fill="#4a2f17" font-weight="bold">MySQL 8.0</text>
  <text x="316" y="374" font-size="12" fill="#5a4632">只读账号 · legacy 表</text>

  <rect x="520" y="326" width="200" height="72" rx="8" fill="#fdfaf3" stroke="#8a6a44" stroke-width="1.4"/>
  <text x="536" y="352" font-size="13" fill="#4a2f17" font-weight="bold">LLM Provider</text>
  <text x="536" y="374" font-size="12" fill="#5a4632">OpenAI 兼容 · 可更换</text>

  <!-- 部署步骤 -->
  <rect x="60" y="424" width="900" height="80" rx="8" fill="#fffdf8" stroke="#b8863b" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="80" y="450" font-size="13" fill="#8a5a1e" font-weight="bold">部署步骤</text>
  <text x="80" y="472" font-size="12" fill="#5a4632">① npm ci　② 复制 .env.example → .env.local 填口令　③ npm run build　④ 启动 shim / ai / serve　⑤ 反向代理按上表分流</text>
  <text x="80" y="492" font-size="12" fill="#5a4632">环境要求：Node ≥ 18、MySQL 8.0；摄像头玩法建议 Chrome / Edge</text>
</svg>
